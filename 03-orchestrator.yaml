apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-agent
  template:
    metadata:
      labels:
        app: frontend-agent
    spec:
      containers:
      - name: frontend-agent
        image: local/medical-frontend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-agent
spec:
  selector:
    app: frontend-agent
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
