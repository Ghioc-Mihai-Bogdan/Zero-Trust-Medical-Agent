  template:
    metadata: { labels: { app: acuity-analyzer } }
    spec:
      containers:
      - name: analyzer
        image: local/acuity-analyzer:v400
        imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: patient-educator }
spec:
