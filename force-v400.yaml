apiVersion: apps/v1
kind: Deployment
metadata: { name: diagnostician }
spec:
  selector: { matchLabels: { app: diagnostician } }
  template:
    metadata: { labels: { app: diagnostician } }
    spec:
      containers:
      - name: diagnostician
        image: local/diagnostician:v400
        imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: medical-coder }
spec:
  selector: { matchLabels: { app: medical-coder } }
  template:
    metadata: { labels: { app: medical-coder } }
    spec:
      containers:
      - name: coder
        image: local/medical-coder:v400
        imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: acuity-analyzer }
spec:
