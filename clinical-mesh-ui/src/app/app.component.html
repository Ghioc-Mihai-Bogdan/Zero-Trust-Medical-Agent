<div class="app-container" [ngClass]="{'light-theme': !isDarkTheme}">
  <div class="sidebar">
    
    <div class="header-row">
      <h2>Mesh Console</h2>
      <button class="theme-btn" (click)="toggleTheme()" title="Toggle Theme">
        {{ isDarkTheme ? '☀️' : '🌙' }}
      </button>
    </div>

    <button class="new-chat-btn" (click)="chatService.startNewSession()">+ New Clinical Session</button>
    
    <ul id="sessionList">
      <li *ngFor="let session of chatService.sessions | async" 
          [class.active-session]="session.id === (chatService.activeSessionId | async)"
          (click)="chatService.switchSession(session.id)">
        <span class="session-title">{{ session.title }}</span>
        <button class="delete-btn" (click)="chatService.deleteSession(session.id, $event)">🗑️</button>
      </li>
    </ul>
    <p class="status-text">Zero-Trust Mode: Active</p>
  </div>

  <div class="main-content">
    <div #chatBox class="chat-container">
      <div *ngFor="let msg of chatService.currentChat | async" class="message" [ngClass]="msg.role === 'user' ? 'user-msg' : 'ai-msg'">
        <div *ngIf="msg.fileName" class="file-badge">📎 {{ msg.fileName }}</div>
        <div [innerText]="msg.content"></div>
      </div>
      <div *ngIf="chatService.isLoading | async" class="message ai-msg loading-msg">Consulting the mesh...</div>
    </div>
    
    <div class="input-wrapper" style="flex-direction: column; align-items: flex-start; padding: 15px;">
      <input type="file" id="file-input" accept=".txt,.pdf,image/*" (change)="onFileSelected($event)" style="display: none;">
      
      <div *ngIf="selectedFile" class="staged-file-badge" style="background: #2a2a35; color: #fff; padding: 6px 12px; border-radius: 6px; margin-bottom: 10px; display: inline-flex; align-items: center; font-size: 0.85rem; border: 1px solid #444;">
        📎 {{ selectedFile.name }}
        <button (click)="removeFile()" style="background: none; border: none; color: #ff6b6b; cursor: pointer; margin-left: 10px; font-weight: bold;">✕</button>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; width: 100%;">
        <button class="file-btn" onclick="document.getElementById('file-input').click()" style="flex-shrink: 0;">📎</button>
        <textarea [(ngModel)]="userInput" placeholder="Message the Clinical Mesh..." rows="1" (keydown)="handleEnter($event)" [disabled]="(chatService.isLoading | async) ?? false" style="flex-grow: 1; resize: none;"></textarea>
        
        <button *ngIf="!(chatService.isLoading | async)" class="send-btn" (click)="send()" style="flex-shrink: 0;">↑</button>
        <button *ngIf="(chatService.isLoading | async)" (click)="chatService.stopGeneration()" style="flex-shrink: 0; background: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">⏹</button>
      </div>
    </div>
  </div>
</div>
