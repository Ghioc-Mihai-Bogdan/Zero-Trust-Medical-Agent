apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: default
spec:
  parentRefs:
  - name: ai-mesh-gateway
  rules:
  # Rule 1: API Traffic goes to Python (Port 8080)
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: frontend-agent
      port: 8080
      
  # Rule 2: All other traffic goes to Angular UI (Port 80)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: medical-ui
      port: 80
