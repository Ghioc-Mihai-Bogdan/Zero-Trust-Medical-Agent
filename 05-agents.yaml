# ==========================================
# 1. Diagnostician
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostician
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diagnostician
  template:
    metadata:
      labels:
        app: diagnostician
    spec:
      containers:
      - name: diagnostician
        image: local/diagnostician:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostician
spec:
  selector:
    app: diagnostician
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

